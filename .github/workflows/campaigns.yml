name: campaigns-api

on:
  push:
    branches: [main]
    paths:
      - "etl_api.py"
      - "pyproject.toml"
      - ".github/workflows/campaigns.yml"
  pull_request:
    paths:
      - "etl_api.py"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      - name: Live API check — always 20-30, today-filter
        run: |
          uv run python -c "
          from fastapi.testclient import TestClient
          from api import app
          import datetime as dt
          c = TestClient(app)
          assert c.get('/health').status_code == 200
          r = c.get('/api/campaigns')
          assert r.status_code == 200, r.text
          j = r.json()
          assert 20 <= j['count'] <= 30, f\"count {j['count']} not in 20-30\"
          today = dt.date.fromisoformat(j['as_of'])
          for camp in j['campaigns']:
              assert camp['campaign_start_date'] <= (today - dt.timedelta(days=7)).isoformat(), camp
              assert camp['campaign_end_date'] > today.isoformat(), camp
          # determinism: same as_of -> same count
          r2 = c.get('/api/campaigns')
          assert r2.json()['count'] == j['count']
          print(f\"OK as_of={j['as_of']} count={j['count']}\")
          "
